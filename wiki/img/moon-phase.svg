<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="The Moon's phase from its elongation from the Sun, eight positions on its orbit"><style>:root{--fg:#24292f;--mute:#6e7781;--acc:#0969da;--warn:#cf222e;--ring:#bf8700}@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--mute:#8b949e;--acc:#58a6ff;--warn:#ff7b72;--ring:#d29922}}text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--fg)}.m{fill:var(--mute)}.s{font-size:12px}.t{font-size:15px;font-weight:600}</style><text x="30.0" y="26.0" class="t" text-anchor="start">How the Moon's phase follows from where it is on its orbit</text><text x="30.0" y="44.0" class="s m" text-anchor="start">Lit fraction k = (1 − cos ψ) / 2 with ψ the Moon–Sun elongation seen from Earth (the phase angle is i ≈ 180° − ψ)</text><circle cx="380" cy="170" r="100" fill="none" stroke="var(--mute)" stroke-opacity="0.5" stroke-dasharray="3 4"/><circle cx="380" cy="170" r="16" fill="var(--acc)" fill-opacity="0.6"/><text x="380.0" y="174.0" class="s" text-anchor="middle">Earth</text><line x1="30" y1="170" x2="150" y2="170" stroke="var(--ring)" stroke-width="2"/><polygon points="150,165 164,170 150,175" fill="var(--ring)"/><text x="30.0" y="158.0" class="s" text-anchor="start">sunlight</text><circle cx="280.0" cy="170.0" r="11" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><path d="M280.0,159.0A11,11 0 0 0 280.0,181.0Z" fill="var(--fg)" fill-opacity="0.85"/><circle cx="70" cy="355" r="30" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><text x="70.0" y="405.0" class="s" text-anchor="middle">New Moon</text><text x="70.0" y="422.0" class="s m" text-anchor="middle">ψ = 0°</text><text x="70.0" y="438.0" class="s m" text-anchor="middle">k = 0.00</text><circle cx="309.3" cy="240.7" r="11" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><path d="M309.3,229.7A11,11 0 0 0 309.3,251.7Z" fill="var(--fg)" fill-opacity="0.85"/><circle cx="158" cy="355" r="30" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><g transform="translate(158,355) scale(1,1)"><path d="M0,-30 A30,30 0 0 1 0,30 A21.21,30 0 0 0 0,-30Z" fill="var(--fg)" fill-opacity="0.85"/></g><text x="158.0" y="405.0" class="s" text-anchor="middle">Waxing Crescent</text><text x="158.0" y="422.0" class="s m" text-anchor="middle">ψ = 45°</text><text x="158.0" y="438.0" class="s m" text-anchor="middle">k = 0.15</text><circle cx="380.0" cy="270.0" r="11" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><path d="M380.0,259.0A11,11 0 0 0 380.0,281.0Z" fill="var(--fg)" fill-opacity="0.85"/><circle cx="246" cy="355" r="30" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><g transform="translate(246,355) scale(1,1)"><path d="M0,-30 A30,30 0 0 1 0,30 A0.00,30 0 0 0 0,-30Z" fill="var(--fg)" fill-opacity="0.85"/></g><text x="246.0" y="405.0" class="s" text-anchor="middle">First Quarter</text><text x="246.0" y="422.0" class="s m" text-anchor="middle">ψ = 90°</text><text x="246.0" y="438.0" class="s m" text-anchor="middle">k = 0.50</text><circle cx="450.7" cy="240.7" r="11" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><path d="M450.7,229.7A11,11 0 0 0 450.7,251.7Z" fill="var(--fg)" fill-opacity="0.85"/><circle cx="334" cy="355" r="30" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><g transform="translate(334,355) scale(1,1)"><path d="M0,-30 A30,30 0 0 1 0,30 A21.21,30 0 0 1 0,-30Z" fill="var(--fg)" fill-opacity="0.85"/></g><text x="334.0" y="405.0" class="s" text-anchor="middle">Waxing Gibbous</text><text x="334.0" y="422.0" class="s m" text-anchor="middle">ψ = 135°</text><text x="334.0" y="438.0" class="s m" text-anchor="middle">k = 0.85</text><circle cx="480.0" cy="170.0" r="11" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><path d="M480.0,159.0A11,11 0 0 0 480.0,181.0Z" fill="var(--fg)" fill-opacity="0.85"/><circle cx="422" cy="355" r="30" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><g transform="translate(422,355) scale(-1,1)"><path d="M0,-30 A30,30 0 0 1 0,30 A30.00,30 0 0 1 0,-30Z" fill="var(--fg)" fill-opacity="0.85"/></g><text x="422.0" y="405.0" class="s" text-anchor="middle">Full Moon</text><text x="422.0" y="422.0" class="s m" text-anchor="middle">ψ = 180°</text><text x="422.0" y="438.0" class="s m" text-anchor="middle">k = 1.00</text><circle cx="450.7" cy="99.3" r="11" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><path d="M450.7,88.3A11,11 0 0 0 450.7,110.3Z" fill="var(--fg)" fill-opacity="0.85"/><circle cx="510" cy="355" r="30" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><g transform="translate(510,355) scale(-1,1)"><path d="M0,-30 A30,30 0 0 1 0,30 A21.21,30 0 0 1 0,-30Z" fill="var(--fg)" fill-opacity="0.85"/></g><text x="510.0" y="405.0" class="s" text-anchor="middle">Waning Gibbous</text><text x="510.0" y="422.0" class="s m" text-anchor="middle">ψ = 225°</text><text x="510.0" y="438.0" class="s m" text-anchor="middle">k = 0.85</text><circle cx="380.0" cy="70.0" r="11" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><path d="M380.0,59.0A11,11 0 0 0 380.0,81.0Z" fill="var(--fg)" fill-opacity="0.85"/><circle cx="598" cy="355" r="30" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><g transform="translate(598,355) scale(-1,1)"><path d="M0,-30 A30,30 0 0 1 0,30 A0.00,30 0 0 1 0,-30Z" fill="var(--fg)" fill-opacity="0.85"/></g><text x="598.0" y="405.0" class="s" text-anchor="middle">Last Quarter</text><text x="598.0" y="422.0" class="s m" text-anchor="middle">ψ = 270°</text><text x="598.0" y="438.0" class="s m" text-anchor="middle">k = 0.50</text><circle cx="309.3" cy="99.3" r="11" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><path d="M309.3,88.3A11,11 0 0 0 309.3,110.3Z" fill="var(--fg)" fill-opacity="0.85"/><circle cx="686" cy="355" r="30" fill="none" stroke="var(--fg)" stroke-opacity="0.6"/><g transform="translate(686,355) scale(-1,1)"><path d="M0,-30 A30,30 0 0 1 0,30 A21.21,30 0 0 0 0,-30Z" fill="var(--fg)" fill-opacity="0.85"/></g><text x="686.0" y="405.0" class="s" text-anchor="middle">Waning Crescent</text><text x="686.0" y="422.0" class="s m" text-anchor="middle">ψ = 315°</text><text x="686.0" y="438.0" class="s m" text-anchor="middle">k = 0.15</text><text x="30.0" y="472.0" class="s m" text-anchor="start">Top: orbit seen from above the north pole, not to scale. Bottom: as seen from the northern hemisphere (names: lunar_phase_name).</text></svg>