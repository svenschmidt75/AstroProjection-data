<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="A quad of four stars and its scale- and rotation-free hash"><style>:root{--fg:#24292f;--mute:#6e7781;--acc:#0969da;--warn:#cf222e;--ring:#bf8700}@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--mute:#8b949e;--acc:#58a6ff;--warn:#ff7b72;--ring:#d29922}}text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--fg)}.m{fill:var(--mute)}.s{font-size:12px}.t{font-size:15px;font-weight:600}</style><text x="30.0" y="26.0" class="t" text-anchor="start">A quad and its hash</text><text x="30.0" y="44.0" class="s m" text-anchor="start">Left: four stars in the image (pixels). Right: the same four in the frame with A at (0, 0) and B at (1, 0).</text><line x1="70.0" y1="190.0" x2="350.0" y2="190.0" stroke="var(--acc)" stroke-width="2"/><circle cx="70.0" cy="190.0" r="5" fill="var(--warn)"/><text x="79.0" y="182.0" class="s" text-anchor="start">A (0, 0)</text><circle cx="350.0" cy="190.0" r="5" fill="var(--warn)"/><text x="359.0" y="182.0" class="s" text-anchor="start">B (10, 0)</text><circle cx="154.0" cy="134.0" r="5" fill="var(--warn)"/><text x="163.0" y="126.0" class="s" text-anchor="start">C (3, 2)</text><circle cx="238.0" cy="218.0" r="5" fill="var(--warn)"/><text x="247.0" y="210.0" class="s" text-anchor="start">D (6, -1)</text><text x="70.0" y="280.0" class="s m" text-anchor="start">widest pair is AB, L = 10 px</text><line x1="470" y1="190" x2="670" y2="190" stroke="var(--acc)" stroke-width="2"/><line x1="570" y1="130" x2="570" y2="250" stroke="var(--mute)" stroke-opacity="0.4" stroke-dasharray="3 3"/><circle cx="470.0" cy="190.0" r="5" fill="var(--warn)"/><text x="479.0" y="182.0" class="s" text-anchor="start">A (0.0, 0.0)</text><circle cx="670.0" cy="190.0" r="5" fill="var(--warn)"/><text x="679.0" y="182.0" class="s" text-anchor="start">B (1.0, 0.0)</text><circle cx="530.0" cy="150.0" r="5" fill="var(--warn)"/><text x="539.0" y="142.0" class="s" text-anchor="start">C (0.3, 0.2)</text><circle cx="590.0" cy="210.0" r="5" fill="var(--warn)"/><text x="599.0" y="202.0" class="s" text-anchor="start">D (0.6, -0.1)</text><text x="470.0" y="280.0" class="s m" text-anchor="start">hash = (0.3, 0.2, 0.6, -0.1)</text><text x="470.0" y="298.0" class="s m" text-anchor="start">the same after any shift, rotation or scaling</text><text x="30.0" y="352.0" class="s m" text-anchor="start">Computed by the app's compute_quad_hash_2d (wcs/quad_solver.rs), the worked example of Plate Solving §2.</text></svg>